<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Karuta">
  <title>Karuta</title>
  <defs>
    <!-- Subtle top highlight on front card -->
    <linearGradient id="mk-hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Back card — washi cream, rotated -13° -->
  <g transform="rotate(-13, 42, 50)">
    <rect x="16" y="14" width="52" height="72" rx="6" fill="#f4e4c0" fill-opacity="0.82"/>
    <rect x="16" y="14" width="52" height="72" rx="6"
          fill="none" stroke="#f4e4c0" stroke-width="1" stroke-opacity="0.40"/>
  </g>

  <!-- Front card — hanko red, upright -->
  <rect x="32" y="14" width="52" height="72" rx="6" fill="#c41e3a"/>

  <!-- Top highlight (depth) -->
  <rect x="32" y="14" width="52" height="40" rx="6" fill="url(#mk-hi)"/>

  <!-- Accent band — evokes the poem/title area of a karuta card -->
  <rect x="32" y="27" width="52" height="3" fill="#f4e4c0" fill-opacity="0.28"/>

  <!-- Edge rim -->
  <rect x="32" y="14" width="52" height="72" rx="6"
        fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.10"/>
</svg>
