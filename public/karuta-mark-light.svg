<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Karuta">
  <title>Karuta</title>

  <!-- Back card — warm sand, rotated -13° -->
  <g transform="rotate(-13, 42, 50)">
    <rect x="16" y="14" width="52" height="72" rx="6" fill="#c8b49a"/>
    <rect x="16" y="14" width="52" height="72" rx="6"
          fill="none" stroke="#6b5040" stroke-width="1.5" stroke-opacity="0.22"/>
  </g>

  <!-- Front card — hanko red, upright -->
  <rect x="32" y="14" width="52" height="72" rx="6" fill="#c41e3a"/>

  <!-- Accent band -->
  <rect x="32" y="27" width="52" height="3" fill="#ffffff" fill-opacity="0.22"/>

  <!-- Edge rim -->
  <rect x="32" y="14" width="52" height="72" rx="6"
        fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12"/>
</svg>
